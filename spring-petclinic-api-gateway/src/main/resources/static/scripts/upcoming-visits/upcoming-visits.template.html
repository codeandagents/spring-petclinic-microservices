<h2>Upcoming visits</h2>
<p ng-if="$ctrl.visits && !$ctrl.visits.length">No visits in the next 7 days.</p>
<table class="table table-striped" ng-if="$ctrl.visits.length">
    <thead>
    <tr>
        <th>Date</th>
        <th>Pet</th>
        <th>Owner</th>
        <th>Description</th>
    </tr>
    </thead>

    <tr ng-repeat="visit in $ctrl.visits">
        <td>{{visit.date}}</td>
        <td>{{visit.petName}}</td>
        <td><a ui-sref="ownerDetails({ ownerId: visit.ownerId })">{{visit.ownerName}}</a></td>
        <td>{{visit.description}}</td>
    </tr>
</table>
